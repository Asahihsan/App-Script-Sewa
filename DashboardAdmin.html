<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMPEWA - Dashboard Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root { --primary: #0f172a; --bg-color: #f8fafc; --text-main: #0f172a; --text-muted: #64748b; --border-color: #e2e8f0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 260px; background: white; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
    .brand { font-size: 18px; font-weight: bold; color: var(--primary); margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
    .menu-list { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
    .menu-item { padding: 12px 15px; border-radius: 8px; cursor: pointer; font-weight: 500; color: var(--text-muted); margin-bottom: 5px; transition: all 0.2s; }
    .menu-item.active, .menu-item:hover { background-color: #f1f5f9; color: var(--primary); }
    .main-content { flex-grow: 1; overflow-y: auto; padding: 30px; }
    .card { background: white; border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border: 1px solid var(--border-color); padding: 10px; text-align: left; }
    th { background-color: #f1f5f9; }
    .btn-action { background: #2563eb; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .btn-danger { background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
    input, select { width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; box-sizing: border-box; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div>
      <div class="brand">⚙️ <span>SIMPEWA Admin</span></div>
      <ul class="menu-list">
        <li class="menu-item active" id="tabUser" onclick="switchTab('user')">👤 Kelola DATA_USER</li>
        <li class="menu-item" id="tabLokasi" onclick="switchTab('lokasi')">🏢 Kelola LOKASI</li>
      </ul>
    </div>
    <div style="margin-top: auto; margin-bottom: 15px; padding-top: 15px; border-top: 1px solid var(--border-color);">
      <p style="font-size: 11px; color: var(--text-muted); margin: 0;">Login Admin:</p>
      <p style="font-size: 12px; font-weight: bold; margin: 3px 0;"><?= emailUser ?></p>
    </div>
    <div class="menu-item" style="color: #ef4444;" onclick="keluarSistem()">🚪 Keluar</div>
  </div>

  <div class="main-content">
    <!-- TAB USER -->
    <div id="pageUser">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>Manajemen User & Multi-Role</h2>
        <button class="btn-action" onclick="bukaModalUser()">➕ Tambah Role User</button>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Email</th>
              <th>Nama User</th>
              <th>Role Assigned</th>
              <th>Status Akun</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tabelAdminUser">
            <tr><td colspan="5" style="text-align: center;">Memuat master user...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- TAB LOKASI -->
    <div id="pageLokasi" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>Manajemen Master Lokasi NF</h2>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Nama Lokasi</th>
              <th>Alamat Lengkap</th>
            </tr>
          </thead>
          <tbody id="tabelAdminLokasi">
            <tr><td colspan="2" style="text-align: center;">Memuat master lokasi...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    var masterUser = [];
    var masterLokasi = [];

    window.onload = function() { loadAdminData(); };

    function switchTab(tab) {
      if (tab === 'user') {
        document.getElementById('pageUser').style.display = 'block';
        document.getElementById('pageLokasi').style.display = 'none';
        document.getElementById('tabUser').className = 'menu-item active';
        document.getElementById('tabLokasi').className = 'menu-item';
      } else {
        document.getElementById('pageUser').style.display = 'none';
        document.getElementById('pageLokasi').style.display = 'block';
        document.getElementById('tabUser').className = 'menu-item';
        document.getElementById('tabLokasi').className = 'menu-item active';
      }
    }

    function loadAdminData() {
      google.script.run
        .withSuccessHandler(function(res) {
          masterUser = res.listUser;
          masterLokasi = res.listLokasi;
          renderTabelUser(res.listUser);
          renderTabelLokasi(res.listLokasi);
        })
        .getAdminMasterData();
    }

    function renderTabelUser(list) {
      var tbody = document.getElementById('tabelAdminUser');
      if (list.length === 0) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Kosong</td></tr>'; return; }
      var html = '';
      list.forEach(function(item) {
        html += '<tr>' +
          '<td><b>' + item.email + '</b></td>' +
          '<td>' + item.nama + '</td>' +
          '<td><span style="background:#e0e7ff; color:#3730a3; padding:3px 8px; border-radius:4px; font-weight:bold;">' + item.role + '</span></td>' +
          '<td><b>' + item.status + '</b></td>' +
          '<td><button class="btn-danger" onclick="hapusUser(' + item.rowIdx + ', \'' + item.email + '\', \'' + item.role + '\')">🗑️ Hapus</button></td>' +
          '</tr>';
      });
      tbody.innerHTML = html;
    }

    function renderTabelLokasi(list) {
      var tbody = document.getElementById('tabelAdminLokasi');
      if (list.length === 0) { tbody.innerHTML = '<tr><td colspan="2" style="text-align:center;">Kosong</td></tr>'; return; }
      var html = '';
      list.forEach(function(item) {
        html += '<tr><td><b>' + item.namaLokasi + '</b></td><td>' + item.alamat + '</td></tr>';
      });
      tbody.innerHTML = html;
    }

    function bukaModalUser() {
      Swal.fire({
        title: 'Tambah Akses Role User',
        html:
          '<input id="mEmail" placeholder="Email User (Contoh: user@gmail.com)" class="swal2-input">' +
          '<input id="mNama" placeholder="Nama Lengkap User" class="swal2-input">' +
          '<select id="mRole" class="swal2-input">' +
            '<option value="Negosiator">Negosiator</option>' +
            '<option value="Sekretaris">Sekretaris</option>' +
            '<option value="Direktur">Direktur</option>' +
            '<option value="Keuangan">Keuangan</option>' +
            '<option value="Admin">Admin</option>' +
          '</select>' +
          '<select id="mStatus" class="swal2-input">' +
            '<option value="Aktif">Aktif</option>' +
            '<option value="Nonaktif">Nonaktif</option>' +
          '</select>',
        showCancelButton: true,
        confirmButtonText: 'Simpan',
        preConfirm: () => {
          return {
            email: document.getElementById('mEmail').value,
            nama: document.getElementById('mNama').value,
            role: document.getElementById('mRole').value,
            status: document.getElementById('mStatus').value
          }
        }
      }).then((res) => {
        if (res.isConfirmed && res.value.email) {
          google.script.run.withSuccessHandler(function(msg) {
            Swal.fire('Berhasil', msg, 'success');
            loadAdminData();
          }).withFailureHandler(function(err) {
            Swal.fire('Gagal', err.message, 'error');
          }).simpanUserMaster(res.value);
        }
      });
    }

    function hapusUser(rowIdx, email, role) {
      Swal.fire({
        title: 'Hapus Role User?',
        text: "Menghapus role " + role + " milik " + email,
        icon: 'warning', showCancelButton: true, confirmButtonText: 'Ya, Hapus'
      }).then((res) => {
        if (res.isConfirmed) {
          google.script.run.withSuccessHandler(function(msg) {
            Swal.fire('Terhapus', msg, 'success');
            loadAdminData();
          }).withFailureHandler(function(err) {
            Swal.fire('Gagal', err.message, 'error');
          }).hapusUserMaster(rowIdx, email, role);
        }
      });
    }

    function keluarSistem() {
      window.top.location.href = "<?= ScriptApp.getService().getUrl() ?>";
    }
  </script>
</body>
</html>
