<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akses Ditolak - SIMPEWA</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card-error { background: white; border: 1px solid #e2e8f0; padding: 40px; border-radius: 16px; text-align: center; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    h1 { color: #ef4444; margin-top: 0; font-size: 24px; }
    p { color: #64748b; font-size: 14px; line-height: 1.5; }
    .email-box { background: #f1f5f9; padding: 8px 12px; border-radius: 6px; font-weight: bold; color: #1e293b; display: inline-block; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="card-error">
    <div style="font-size: 50px; margin-bottom: 10px;">🚫</div>
    <h1>Akses Ditolak</h1>
    <p>Email Google Anda saat ini:</p>
    <div class="email-box"><?= emailUser ?></div>
    <p>Email tersebut <b>belum terdaftar</b> di sheet <code>DATA_USER</code> SIMPEWA. Silakan hubungi Administrator untuk mendaftarkan akun dan wewenang Anda.</p>
  </div>

</html>
