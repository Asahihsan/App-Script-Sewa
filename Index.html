<script>
    // 1. Fungsi saat tombol diklik
    function mulaiMasuk() {
      var btn = document.getElementById("btnMasuk");
      btn.innerHTML = '<span class="spinner"></span> Memeriksa Akses...';
      btn.disabled = true;

      // Memanggil backend untuk cek akses
      google.script.run
        .withSuccessHandler(prosesHasilAkses)
        .withFailureHandler(function(error) {
           alert("SISTEM ERROR:\n" + error.message);
           btn.innerHTML = "Coba Lagi";
           btn.style.backgroundColor = "#ef4444"; // Merah
           btn.disabled = false;
        })
        .cekAksesUser();
    }

    // 2. Fungsi untuk memproses balasan dari backend
    function prosesHasilAkses(hasil) {
      var btn = document.getElementById("btnMasuk");
      
      if (hasil.status === true) {
        btn.innerHTML = "Berhasil! Mengalihkan...";
        btn.style.backgroundColor = "#10b981"; // Hijau
        
        // Meminta tampilan dashboard dari Code.gs sesuai role-nya
        google.script.run
          .withSuccessHandler(function(htmlContent) {
             // Menimpa halaman login dengan halaman dashboard
             document.open();
             document.write(htmlContent);
             document.close();
          })
          .getHalamanDashboard(hasil.role);
          
      } else {
        btn.innerHTML = "Akses Ditolak";
        btn.style.backgroundColor = "#ef4444"; // Merah
        
        alert("GAGAL MASUK:\n" + hasil.pesan);
        
        setTimeout(() => {
          btn.innerHTML = "Masuk ke Sistem";
          btn.style.backgroundColor = "#2563eb"; // Biru kembali
          btn.disabled = false;
        }, 3000);
      }
    }
  </script>

<script>
  if (typeof rawLottieData !== 'undefined' && rawLottieData.layers) {
    rawLottieData.layers = rawLottieData.layers.filter(layer => {
      const name = (layer.nm || '').toLowerCase();
      const isBg = layer.ty === 1 || name.includes('bg') || name.includes('background') || name.includes('solid');
      const isWatermark = layer.ty === 5 || name.includes('watermark') || name.includes('text');
      return !isBg && !isWatermark;
    });

    lottie.loadAnimation({
      container: document.getElementById('lottie-container'),
      animationData: rawLottieData,
      renderer: 'svg',
      loop: true,
      autoplay: true
    });
  }

  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('splash-screen').style.opacity = '0';
      document.getElementById('splash-screen').style.visibility = 'hidden';

      setTimeout(() => {
        document.getElementById('wipeCurtain').classList.add('slide-up');
      }, 150);
    }, 2500);
  });
</script>
